<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💖</title>
    <style>
        body {
            text-align: center;
            background-color: #ffe6e6;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            color: #ff3366;
            font-size: 2.5em;
            text-shadow: 2px 2px #ffb3b3;
        }
        .heart {
            font-size: 3rem;
            animation: heartbeat 1s infinite;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .btn-container {
            margin-top: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: 0.3s;
        }
        #yesBtn {
            background-color: #ff3366;
            color: white;
        }
        #noBtn {
            background-color: #cccccc;
            color: black;
        }
        button:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <h1>Will you be my Valentine? 💖</h1>
    <div class="heart">❤️</div>
    <div class="btn-container">
        <button id="yesBtn" onclick="yesClicked()">Yes! 💕</button>
        <button id="noBtn" onclick="noClicked()">No 🙁</button>
    </div>

    <script>
        function yesClicked() {
            document.body.innerHTML = '<h1>YAY! 🎉💖 I knew you'd say yes! 🥰</h1>';
        }
        
        let noCount = 0;
        function noClicked() {
            let messages = [
                "Are you really sure? 😢", 
                "Think again... 🥺", 
                "Come on, don't break my heart 💔", 
                "You're just playing hard to get, right? 😏", 
                "I'll ask one more time... pretty please? 🥹", 
                "Okay, last chance! 🙃"
            ];
            
            if (noCount < messages.length) {
                document.getElementById("noBtn").innerText = messages[noCount];
                noCount++;
            } else {
                document.getElementById("noBtn").innerText = "You have no escape now! 😈";
                document.getElementById("noBtn").style.position = "absolute";
                document.getElementById("noBtn").style.left = Math.random() * window.innerWidth + "px";
                document.getElementById("noBtn").style.top = Math.random() * window.innerHeight + "px";
            }
        }
    </script>
</body>
</html>
